services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: belies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: belies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belies"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://belies:${POSTGRES_PASSWORD}@db:5432/belies
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://belies:${POSTGRES_PASSWORD}@db:5432/belies
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
